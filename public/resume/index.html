<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume | Elizabeth Hsu</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #181817; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100% - 40px, 480px); margin: clamp(32px, 10vh, 95px) auto; }
    a { color: #96354d; text-underline-offset: 3px; }
    h1 { margin: 28px 0 6px; font: 500 clamp(42px, 9vw, 60px)/1.1 Georgia, serif; letter-spacing: -.04em; }
    p { margin: 0; }
    form { display: grid; gap: 20px; margin-top: 28px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, textarea { width: 100%; border: 1px solid #aaa8a4; border-radius: 4px; padding: 10px 12px; color: inherit; background: #fff; font: inherit; font-weight: 400; }
    textarea { min-height: 108px; resize: vertical; }
    button { justify-self: start; min-height: 44px; border: 0; border-radius: 4px; padding: 10px 16px; background: #181817; color: #fff; font: inherit; cursor: pointer; }
    button:hover { background: #96354d; }
    :focus-visible { outline: 2px solid #96354d; outline-offset: 3px; }
    .hint { color: #5e5d59; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <a href="../#contact">Back to overview</a>
    <h1>Resume</h1>
    <p>Drop your email and I'll send it to you.</p>
    <form id="request" action="mailto:lchsu@andrew.cmu.edu" method="post" enctype="text/plain">
      <label>
        Email (required)
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Context
        <textarea name="context" rows="4"></textarea>
      </label>
      <button type="submit" aria-describedby="request-hint">Send me the resume</button>
      <p id="request-hint" class="hint">Opens a draft in your email app for you to send.</p>
    </form>
  </main>
  <script>
    const form = document.getElementById('request');
    form.addEventListener('submit', event => {
      event.preventDefault();
      const fields = new FormData(form);
      const context = fields.get('context').trim();
      const body = [
        'Hi Elizabeth, could you send me your resume?',
        'Email: ' + fields.get('email'),
        context ? 'Context: ' + context : '',
      ].filter(Boolean).join('\r\n\r\n');
      window.location.href = 'mailto:lchsu@andrew.cmu.edu?subject=Resume%20request&body=' + encodeURIComponent(body);
    });
  </script>
</body>
</html>
