<!doctype html>
<meta charset="utf-8">
<title>CMUsed journey renderer</title>
<canvas id="film" width="1600" height="900"></canvas>
<script>
const canvas = document.querySelector('canvas'), c = canvas.getContext('2d');
// Each frame is an existing prototype screen. Coordinates match its clickable hotspots.
const scenes = [
  {file:'Log in', crop:[0,0,1280,720], from:[800,580], to:[290,500], end:3.8},
  {file:'Onboarding (buyer-seller)', crop:[0,0,1280,720], from:[780,600], to:[590,650], end:7.6},
  {file:'Onboarding (categories)', crop:[0,0,1280,720], from:[650,500], to:[590,630], end:11.4},
  {file:'Onboarding (Media)', crop:[0,0,1280,720], from:[720,480], to:[650,640], end:14.5},
  {file:'Onboarding (policy)', crop:[0,0,1280,720], from:[720,480], to:[650,590], end:17.6},
  {file:'Discovery feed', crop:[0,0,1600,900], from:[800,650], to:[1160,450], end:22},
  {file:'Search Result - no filters', crop:[0,0,1318,741], from:[650,600], to:[400,410], end:26},
  {file:'Product Detail-1', crop:[0,0,1600,900], from:[650,650], to:[1040,630], end:30},
  {file:'Contact Seller Pop-up', crop:[0,0,1600,900], from:[1040,630], to:[800,650], end:34}
];
const images=scenes.map(s=>{const i=new Image();i.src='/cmused/'+encodeURIComponent(s.file+'.jpg');return i;});
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function draw(t){
 let index=scenes.findIndex(s=>t<s.end); if(index<0)index=scenes.length-1;
 const s=scenes[index], start=index?scenes[index-1].end:0, local=t-start, length=s.end-start;
 const img=images[index], [x,y,w,h]=s.crop;
 c.fillStyle='#fffbf6';c.fillRect(0,0,1600,900);
 if(img.complete&&img.naturalWidth)c.drawImage(img,x,y,w,h,0,0,1600,900);
 const p=ease((local-.6)/Math.max(.1,length-1.7));
 const px=(s.from[0]+(s.to[0]-s.from[0])*p)*1600/w, py=(s.from[1]+(s.to[1]-s.from[1])*p)*900/h;
 c.save();c.translate(px,py);c.shadowColor='#0005';c.shadowBlur=5;c.shadowOffsetY=2;
 c.beginPath();c.moveTo(0,0);c.lineTo(0,30);c.lineTo(8,23);c.lineTo(14,35);c.lineTo(19,32);c.lineTo(13,20);c.lineTo(24,20);c.closePath();c.fillStyle='white';c.fill();c.lineWidth=2;c.strokeStyle='#222';c.stroke();c.restore();
}
async function start(){
 await Promise.all(images.map(i=>i.decode().catch(()=>{})));
 const stream=canvas.captureStream(30), recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:6500000}), chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='cmused-journey.webm';a.click();document.title='RENDER COMPLETE';};
 recorder.start();const start=performance.now();function frame(now){const t=(now-start)/1000;draw(t);if(t<34)requestAnimationFrame(frame);else recorder.stop()}requestAnimationFrame(frame);
}
start();
</script>
