<!doctype html>
<meta charset="utf-8">
<title>CMUsed journey renderer</title>
<canvas id="film" width="1280" height="720"></canvas>
<script>
const canvas=document.querySelector('canvas'), c=canvas.getContext('2d');
// Source coordinates are measured against the supplied prototype screens.
const scenes=[
 {file:'Log in', crop:[0,0,1280,830], from:[750,650], to:[290,500], end:2.4},
 {file:'Onboarding (buyer-seller)', crop:[0,0,1280,830], from:[850,480], to:[640,708], end:4.6},
 {file:'Onboarding (categories)', crop:[0,0,1280,830], from:[700,460], to:[640,688], end:6.8},
 {file:'Onboarding (Media)', crop:[0,0,1280,830], from:[730,500], to:[640,695], end:8.8},
 {file:'Onboarding (policy)', crop:[0,0,1280,830], from:[700,500], to:[418,623], end:10.8},
 {file:'Discovery feed', crop:[0,0,1600,1430], from:[850,730], to:[1180,460], end:13.5},
 {file:'Search Result - no filters', crop:[0,0,1318,800], from:[500,300], to:[210,500], end:16.2},
 {file:'Product Detail-1', crop:[0,0,1600,1000], from:[700,500], to:[1040,650], end:19},
 {file:'Contact Seller Pop-up', crop:[0,0,1600,1250], from:[1020,650], to:[800,1110], end:21.5}
];
const images=scenes.map(s=>{const i=new Image();i.src='/cmused/'+encodeURIComponent(s.file+'.jpg');return i});
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function draw(t){
 c.setTransform(.8,0,0,.8,0,0);
 let index=scenes.findIndex(s=>t<s.end);if(index<0)index=scenes.length-1;
 const s=scenes[index], start=index?scenes[index-1].end:0, local=t-start, length=s.end-start;
 const img=images[index], [x,y,w,h]=s.crop, scale=Math.min(1600/w,900/h), dw=w*scale,dh=h*scale, left=(1600-dw)/2,top=(900-dh)/2;
 c.fillStyle='#f8f3ed';c.fillRect(0,0,1600,900);
 if(img.complete&&img.naturalWidth)c.drawImage(img,x,y,w,h,left,top,dw,dh);
 const p=ease((local-.35)/Math.max(.1,length-1));
 const px=left+(s.from[0]+(s.to[0]-s.from[0])*p-x)*scale,py=top+(s.from[1]+(s.to[1]-s.from[1])*p-y)*scale;
 c.save();c.translate(px,py);c.shadowColor='#0005';c.shadowBlur=5;c.shadowOffsetY=2;
 c.beginPath();c.moveTo(0,0);c.lineTo(0,27);c.lineTo(7,21);c.lineTo(13,32);c.lineTo(17,30);c.lineTo(12,19);c.lineTo(22,19);c.closePath();c.fillStyle='white';c.fill();c.lineWidth=2;c.strokeStyle='#222';c.stroke();c.restore();
}
async function start(){
 await Promise.all(images.map(i=>i.decode().catch(()=>{})));
 const recorder=new MediaRecorder(canvas.captureStream(30),{mimeType:'video/webm;codecs=vp8',videoBitsPerSecond:2500000}),chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='cmused-journey-v3.webm';a.click();document.title='RENDER COMPLETE'};
 recorder.start();const start=performance.now();function frame(now){const t=(now-start)/1000;draw(t);if(t<21.5)requestAnimationFrame(frame);else recorder.stop()}requestAnimationFrame(frame);
}
start();
</script>
